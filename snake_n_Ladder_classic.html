<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake and Leader</title>
    <link rel="icon" type="image/svg+xml" href="./img/icons/site-icon.svg">
    <link rel="stylesheet" href="./css/classic.css">
</head>
<body>
    <div class="blur"></div>
    <header>Snake and Leader</header>
    <main>
        <aside class="gameSidebar">
            <button id="mobileOptionsToggle" class="mobileOptionsToggle" type="button" aria-expanded="false">
                Show Options
            </button>
            <section class="sidebarSection turnSection">
                <div class="playerTurnInfo">Player 1's Turn</div>
            </section>
            <section class="sidebarSection themeSelector collapsed" aria-label="Theme selection">
                <button id="themeToggleBtn" class="themeToggleBtn" type="button" aria-expanded="false" aria-controls="themeButtons">
                    <span>Theme</span>
                    <span id="currentThemeLabel">Light</span>
                </button>
                <div id="themeButtons" class="themeButtons">
                    <button class="themeBtn" type="button" data-theme-value="light">Light</button>
                    <button class="themeBtn" type="button" data-theme-value="dark">Dark</button>
                    <button class="themeBtn" type="button" data-theme-value="forest">Forest</button>
                    <button class="themeBtn" type="button" data-theme-value="neon">Neon</button>
                    <button class="themeBtn" type="button" data-theme-value="royal">Royal</button>
                    <button class="themeBtn" type="button" data-theme-value="candy">Candy</button>
                    <button class="themeBtn" type="button" data-theme-value="classic">Classic</button>
                    <button class="themeBtn" type="button" data-theme-value="jungle">Jungle</button>
                    <button class="themeBtn" type="button" data-theme-value="ocean">Ocean</button>
                    <button class="themeBtn" type="button" data-theme-value="sunset">Sunset</button>
                    <button class="themeBtn" type="button" data-theme-value="minimal">Minimal</button>
                </div>
            </section>
            <section class="sidebarSection fullScrenTogleBtnBlock">
                <p id="toggleScreenText">Enter Full Screen</p>
                <button id="toggleScreenBtn">
                    <img src="./img/expand-solid-full.svg" alt="exend" title="Full Screen" id="toggleScreenBtnImg">
                </button>
            </section>
                
            <section class="sidebarSection diceBlock">
                <div class="diceHeader">
                    <p id="diceInstructions">Tap to Roll Dice</p>
                    <label for="diceToggleBtn" class="switch" >
                <input type="checkbox" name="" id="diceToggleBtn" aria-checked="false" checked>
                <div class="switch-btn"></div>
                    </label>
                </div>
                <!-- <div id="dice" >🎲</div> -->
                <div class="dice_container">
                    <div class="dice">
                        <div class="face front"></div>
                        <div class="face back"></div>
                        <div class="face top"></div>
                        <div class="face bottom"></div>
                        <div class="face right"></div>
                        <div class="face left"></div>
                    </div>
                </div>
                
                <div id="manualDiceRoll" class="hide">
                    <button value="1">1</button>
                    <button value="2">2</button>
                    <button value="3">3</button>
                    <button value="4">4</button>
                    <button value="5">5</button>
                    <button value="6">6</button>
                </div>
            </section>
            <section class="sidebarSection startSection">
                <button id="startNewGameBtn">Start New Game</button>
            </section>
        </aside>
        <div id="bord"><div id="plateform"></div><div id="completePlateform"></div></div>
    </main>
    <footer>&copy; Snake and Leader Game | Made with <a href="./img/cupple.gif" target="_blank">❤️</a> for Rashi. </footer>


    <div id="newGameConfirmDialog" class="confirmDialog hide" role="dialog" aria-modal="true" aria-labelledby="newGameConfirmTitle">
        <div class="confirmDialogBox">
            <h2 id="newGameConfirmTitle">Start New Game?</h2>
            <p>Current game progress will be replaced.</p>
            <div class="confirmDialogActions">
                <button type="button" id="cancelNewGameBtn" class="confirmDialogBtn secondary">Cancel</button>
                <button type="button" id="confirmNewGameBtn" class="confirmDialogBtn primary">Start</button>
            </div>
        </div>
    </div>

    <!-- pop up box start  -->
 <div id="newPlayerCard" class="hide">
        <!-- player Count container -->

        <div id="playerCount_container" class="player-container_base">
            <form action="" name="playerCountForm" method="GET">
                <label for="player_count" class='player_count_label'>Choose Number of Players</label>
                <div id="player_countDis">Players: 1</div>
                <input type="range" id="player_count" min="1" max="4" step="1" value="1" list="tickmarks">
                
                <datalist id="tickmarks">
                    <option value="1" label="1"></option>
                    <option value="2" label="2"></option>
                    <option value="3" label="3"></option>
                    <option value="4" label="4"></option>
                </datalist>
                <button type="submit">Go...</button>
            </form>
        </div>

        <!-- player Avater container -->
        <div id="playerAvtar_container" class="player-container_base  hide"></div>

    </div>
<script type="module" src="./js/script.js"></script>   
</body>
</html>
